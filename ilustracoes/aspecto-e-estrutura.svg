<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <rect width="1500" height="900" fill="#f3eee2"/>
  <text x="750" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="46" fill="#233d34">Ler uma forma em camadas</text>
  <text x="750" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#665e50">Pessoa, relação, base e aspecto não são a mesma informação.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="110" y="245" width="250" height="135" rx="26" fill="#d8e2d5" stroke="#4b6759" stroke-width="3"/>
    <text x="235" y="303" font-size="31" fill="#263f36">PESSOA</text><text x="235" y="344" font-size="19" fill="#526a5d">quem é indexado?</text>
    <rect x="420" y="245" width="250" height="135" rx="26" fill="#e8ddc7" stroke="#8c704c" stroke-width="3"/>
    <text x="545" y="303" font-size="31" fill="#4d3b28">RELACIONAL</text><text x="545" y="344" font-size="19" fill="#826b4d">R1 ou R2?</text>
    <rect x="730" y="245" width="250" height="135" rx="26" fill="#dbe2e4" stroke="#60787e" stroke-width="3"/>
    <text x="855" y="303" font-size="31" fill="#344d52">BASE</text><text x="855" y="344" font-size="19" fill="#60787e">qual tema?</text>
    <rect x="1040" y="245" width="250" height="135" rx="26" fill="#e3ded6" stroke="#796c61" stroke-width="3"/>
    <text x="1165" y="303" font-size="31" fill="#4f443d">ASPECTO</text><text x="1165" y="344" font-size="19" fill="#796c61">PRF ou IPRF?</text>
    <path d="M235 430 C380 560 1010 560 1165 430" fill="none" stroke="#a18c6c" stroke-width="4" stroke-dasharray="12 12"/>
    <rect x="275" y="575" width="950" height="155" rx="34" fill="#fffaf0" stroke="#2d493e" stroke-width="4"/>
    <text x="750" y="638" font-family="Georgia,serif" font-size="34" fill="#263f36">ANALISAR → COMBINAR → INTERPRETAR</text>
    <text x="750" y="687" font-size="22" fill="#665e50">Não traduza a forma inteira antes de enxergar suas peças.</text>
  </g>
</svg>